- id: task-921552c0
  title: '[LCA-BACKUP] Grid-side BTM-battery-as-backup LCA (vs behind-the-meter)'
  description: '**Problem.** BTM battery can serve either (a) grid-side firming (reduces hyperscale demand on the grid during peaks) or (b) household reliability. The LCA is identical but the attribution rule differs. Need both scenarios cleanly separable in the model.


    **Deliverable.** `R/backup_lca.R::backup_lca_btm_battery(mwh, chemistry, mode)` where mode in c(''grid_firming'', ''household_reliability''). Mode selects the amortization rule (per MWh-cycled vs per MWh-reliable).


    **Acceptance criteria.**

    1. Function returns 17-midpoint factors + the attribution mode in the output.

    2. Round-trip test: grid_firming + household_reliability on the same unit sum to 100% of embodied factors.

    3. Documented alongside gas peaker.


    **Non-goals.** No two-sided simultaneous attribution (one BESS used for both). That''s a research project in its own right.


    **Files.** `R/backup_lca.R` (append).'
