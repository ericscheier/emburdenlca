- id: task-d06eac0a
  title: '[LCA-NERC] Per-NERC diesel-tier default (Tier IV coastal mandates)'
  description: '**Problem.** Wright''s `diesel_backup.py` defaults to EPA Tier II for every region. California (CARB), Texas coastal counties, and Northeast port-adjacent counties all mandate Tier IV. Tier IV cuts NOx 94% + PM2.5 90% vs Tier II (`diesel_backup.py:42-62`).


    **Deliverable.** A per-NERC Tier default lookup in emburdenlca that wright can read via its config system. CAISO → Tier IV; NYISO, ISO-NE → Tier IV; SERC_SE, PJM-DE, SPP → Tier II.


    **Acceptance criteria.**

    1. `load_nerc_diesel_tier_default()` returns a 7-row tibble.

    2. CAISO + NYISO + ISO-NE map to Tier IV.

    3. Tier II mapping documents the state-coverage caveat.


    **Non-goals.** No per-county tier override (coastal vs inland). No historical Tier phase-in dates.


    **Files.** `R/nerc_regional_factors.R` (append), `inst/extdata/nerc_diesel_tier_default.csv` (new).'
