- id: task-e758cea2
  title: '[LCA-NERC] Regionalize grid-electricity LCA factors by NERC region'
  description: '**Problem.** `emburdenlca::load_useeio_v2()` is national; EXIOBASE is country-level. Nothing varies grid-electricity LCA factors by NERC region, which is the single biggest driver of marginal-dispatch LCA heterogeneity (`regional_damages_bar.png` shows 4,000× health-damage spread).


    **Deliverable.** `R/nerc_regional_factors.R` with `load_nerc_grid_factors(nerc_region, year = 2024)` returning per-MWh factors: `co2e_marginal_kg_mwh, co2e_average_kg_mwh, nox_kg_mwh, so2_kg_mwh, pm25_kg_mwh, water_m3_mwh`. Sources: eGRID BA-year panel (`data/egrid_ba_year_2009_2024.csv`), aggregated via the county_nerc_crosswalk from task 1.


    **Acceptance criteria.**

    1. Function returns all seven NERC regions.

    2. Round-trip: aggregated 2024 CO2e matches eGRID national within 2%.

    3. A test in `tests/testthat/test-nerc-factors.R` locks the API.


    **Non-goals.** No sub-regional (BA-level) factors. No hourly dispatch — annual averages only.


    **Files.** `R/nerc_regional_factors.R` (new), `tests/testthat/test-nerc-factors.R` (new).'
