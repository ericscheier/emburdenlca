- id: task-905b3978
  title: '[LCA-COMPUTE] Workload taxonomy: training vs inference vs batch (load factor + flex)'
  description: '**Problem.** Wright''s CCC model treats data-center load as flat 24/7/365. Real AI workloads have very different diurnal + weekly profiles: training is highly flexible (can shift to curtailment hours); inference is near-flat (must-run); batch is batchable. The taxonomy drives the storage-sizing (task 11) and the CCC equity constraint.


    **Deliverable.** `R/compute_sizing.R::load_workload_taxonomy()` returning a tibble: workload_type, load_factor_mean, load_factor_p90, flexibility_score (0-1), must_run_hours_per_year. Four rows: training, inference, batch, crypto.


    **Acceptance criteria.**

    1. Function returns 4 rows.

    2. flexibility_score: training 0.6, inference 0.05, batch 0.9, crypto 0.1.

    3. Documented from the Masanet 2020 + Andrae 2020 datacenter energy literature.


    **Non-goals.** No ML-training-specific GPU workload modeling (that''s a GenX layer concern).


    **Files.** `R/compute_sizing.R` (append), `inst/extdata/workload_taxonomy.csv` (new).'
