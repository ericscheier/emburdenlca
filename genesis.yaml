  title: '[LCA-DEEPENING] emburdenlca research backlog — NERC + storage + backup + HEII→CCC'
  description: 'Deepen the Compute Carrying Capacity model and the emburdenlca factor library across six dimensions:


    1. NERC-regional attribute variation beyond GenX dispatch (water AWARE, diesel tier, BTM solar CF currently inherit Duke default on wright).

    2. Storage/BESS LCA factors for LFP / NMC / sodium-ion / pumped-hydro / hydrogen / flow (wright has LFP+NMC+Na-ion; muir emburdenlca has none).

    3. Backup alternatives (natural-gas peaker, BTM battery, hydrogen fuel cell, pumped-hydro) with acute + lifecycle + embodied impacts (today only diesel is modeled grid-side).

    4. Compute workload → storage-headroom sizing (training vs inference vs batch × storage MWh/MW ratio × NERC region).

    5. HEII → CCC equity constraint as a BINDING gate (currently architected but DISABLED on wright configs/default.yml:33-36).

    6. NERC-region map viz using the unused data/nerc_regions.gdb shapefile.


    Paper 2 Model-chapter deliverable, target ES&T / Nature Energy Dec 2026. 25 subtasks will be submitted under this epic — grep genesis.yaml for [LCA-DEEPENING] or filter by this parent in Asana.

    '
