- id: task-bf86ae07
  title: '[LCA-COMPUTE] Compute-type → implied storage MWh/MW sizing table'
  description: '**Problem.** Different AI compute workloads (training vs inference vs batch) have different load profiles → different storage sizing needs to flatten the data-center''s demand on the grid. Wright''s `btm_generation.py` hardcodes 4-hour duration everywhere.


    **Deliverable.** `R/compute_sizing.R::compute_storage_sizing(workload_type, load_mw)` returning required storage MWh and MW-hour-rating for grid-integration (not reliability, which is a separate layer).


    **Acceptance criteria.**

    1. Workload taxonomy supports ''training'', ''inference'', ''batch'', ''crypto''.

    2. Training → high ramp, implied storage ≥ 0.5 h × load_MW.

    3. Inference → flat, implied storage ~0.1 h × load_MW.

    4. Table documented in roxygen.


    **Non-goals.** No actual demand-response modeling. No real-time dispatch.


    **Files.** `R/compute_sizing.R` (new), `inst/extdata/workload_storage_sizing.csv` (new).'
